<div class="bg-white rounded-lg shadow overflow-hidden">
  <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
    <h3 class="text-lg font-semibold">Список подписок</h3>
    <div class="flex gap-2 items-center">
      <label class="flex items-center text-sm" for="show-expired">
        <input
          id="show-expired"
          type="checkbox"
          class="mr-2"
          [checked]="showExpired()"
          (change)="toggleExpired($event)"
        />
        Показать истекшие
      </label>
      <button type="button" (click)="refresh.emit()" class="text-sm text-blue-600 hover:text-blue-800">
        Обновить
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="p-6 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600" role="status"
        aria-label="Загрузка"></div>
    </div>
  } @else if (filtered().length === 0) {
    <div class="p-6 text-center text-gray-500">Нет подписок</div>
  } @else {
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Пользователь</th>
            <th scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Статус</th>
            <th scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Истекает</th>
            <th scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Дней осталось</th>
            <th scope="col"
              class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Действия</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          @for (sub of filtered(); track sub.username) {
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ sub.username }}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <app-status-badge [status]="sub.status" />
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ formatDate(sub.expires_at) }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm">
                <span [class]="(sub.days_remaining ?? 0) < 7 ? 'text-red-600 font-semibold' : 'text-gray-500'">
                  {{ sub.days_remaining }} дн.
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm">
                <button type="button" (click)="extend.emit(sub.username)"
                  class="text-blue-600 hover:text-blue-900 mr-3">Продлить</button>
                <button type="button" (click)="revoke.emit(sub.username)"
                  class="text-red-600 hover:text-red-900">Отозвать</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
